[package]
name = "octo-connector-search"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Web search for Octo with Tavily, Yandex, Brave and DuckDuckGo backends."

[dependencies]
octo-core = { path = "../../octo-core" }
octo-browser-runtime = { path = "../../components/browser-runtime" }
tokio = { workspace = true, features = ["io-util", "process", "sync", "rt", "macros", "time"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
quick-xml = "0.36"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

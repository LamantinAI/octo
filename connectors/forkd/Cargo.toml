[package]
name = "octo-connector-forkd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Linux subprocess runner for executable skills with a scoped environment, optional privilege drop, and process limits."

[dependencies]
octo-core = { path = "../../octo-core" }
octo-workspace = { path = "../../components/workspace" }
tokio = { workspace = true, features = ["process", "time", "io-util", "rt", "macros", "sync"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
libc = "0.2"

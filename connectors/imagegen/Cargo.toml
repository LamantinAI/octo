[package]
name = "octo-connector-imagegen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Image-generation connector for the Octo runtime: draws or edits an image with gpt-image-2 through the ChatGPT-subscription Images endpoint (no API key, no per-image billing). An env-as-tools organ that shares the runtime's subscription token through octo-openai-auth."

[dependencies]
octo-core = { path = "../../octo-core" }
octo-workspace = { path = "../../components/workspace" }
octo-openai-auth = { path = "../../components/openai-auth" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }

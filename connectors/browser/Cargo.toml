[package]
name = "octo-connector-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read JavaScript-rendered pages with Moli or Chrome."

[dependencies]
octo-core = { path = "../../octo-core" }
octo-browser-runtime = { path = "../../components/browser-runtime" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
fs2 = "0.4"
# zendriver — Rust-native stealth browser over CDP (drives real Chrome). `fetcher`
# auto-provisions a managed Chrome-for-Testing so no system chromium is required.
zendriver = { workspace = true, features = ["fetcher"] }

[dev-dependencies]
tempfile = "3"

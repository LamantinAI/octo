[package]
name = "octo-http-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reusable HTTP/network authentication modes for Octo connectors: Basic, Bearer, and OAuth2 with refresh-token exchange and access-token caching. Config-deserializable, secrets read from the environment."

[dependencies]
